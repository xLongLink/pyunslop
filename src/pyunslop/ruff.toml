line-length = 140
extend-exclude = ["build", "dist", "node_modules", "venv"]

[format]
skip-magic-trailing-comma = true
exclude = ["*.md"]

[lint]
preview = true
select = [
    "F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N",
    "PERF", "PTH", "A", "S", "ASYNC", "ANN", "B006", "E302", "E305",
    "E262", "E265", "C403", "C419", "PGH003", "PT", "RUF100", "TID252",
]
ignore = ["D100", "D104", "D202", "D203", "D213"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
"tests/**" = ["ARG", "N803", "S"]
"ruff.py" = ["S404", "S603"]

[lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false

[lint.pep8-naming]
extend-ignore-names = ["visit_*"]

[lint.flake8-builtins]
ignorelist = ["Warning"]
