[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyunslop"
version = "0.0.0"
description = "Python lint checks for humans and coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["ruff>=0.17.3,<1"]
keywords = ["lint", "comments", "agents", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
pyunslop = "pyunslop.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-mock>=3.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyunslop = ["py.typed", "ruff.toml"]
