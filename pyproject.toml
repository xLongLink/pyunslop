[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyunslop"
version = "0.0.0"
description = "Warning-only Python code checks for humans and coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["lint", "comments", "agents", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
pyunslop = "pyunslop.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-mock>=3.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyunslop = ["py.typed"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = ["F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N", "PERF", "PTH", "A", "S", "ASYNC", "ANN", "B006", "E302", "E305", "PGH003", "PT", "RUF100", "S324", "S506"]
ignore = ["D100", "D104", "D202"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N803", "S"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["visit_*"]
